name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/fixtures/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/fixtures/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app/ tests/ --exit-zero  # 기존 경고 11건 정리 전까지는 보고만
      - run: mkdir -p tests/data
      - run: pytest
