name: research

on:
  pull_request:
    paths:
      - "research/**"
      - "shared/**"
      - "backend/app/domain/**"
      - "backend/app/infrastructure/indicators.py"
      - ".github/workflows/research.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "shared/**"
      - "backend/app/domain/**"
      - "backend/app/infrastructure/indicators.py"
      - ".github/workflows/research.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            research/pyproject.toml
      - run: pip install -e ../backend -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
