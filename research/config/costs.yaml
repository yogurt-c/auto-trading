# 거래 비용. 비율은 소수 (0.001 = 0.1%).
commission_rate: 0.00015        # 매수·매도 각각 (KIS 비대면 수준)
slippage_rate: 0.001            # 편도, 다음 날 시가 대비 불리한 방향
slippage_stress: [0.002, 0.003] # 민감도 확인용
etf_slippage_rate: 0.0005       # 기준 전략 ETF (KODEX 200)

# 증권거래세 (매도 시, 농어촌특별세 포함). KOSPI 기준, 적용 시작일 → 세율.
# ETF 매도는 거래세 면제.
sell_tax_kospi:
  "1900-01-01": 0.0030
  "2019-05-30": 0.0025
  "2021-01-01": 0.0023
  "2023-01-01": 0.0020
  "2024-01-01": 0.0018
  "2025-01-01": 0.0015
  "2026-01-01": 0.0020

dividend_tax_rate: 0.154        # 현금배당 원천징수 (배당소득세 + 지방소득세)
cash_interest_rate: 0.0         # 미투자 현금 이자. 0으로 두어 현금 비중 큰 전략을 우대하지 않음
