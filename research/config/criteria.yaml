# 통과 기준 — 백테스트 실행 전 사전 등록. 이 파일의 커밋 해시가 사전 등록 증거.
# 결과를 본 뒤 수치를 바꾸지 않는다. 바꿔야 한다면 새 기준으로 검증 구간을 다시 쓸 수 없음을 기록한다.

metrics:
  returns: daily_simple_total_equity   # 비용·배당(세후) 반영, 현금 이자 0
  sharpe: {annualization: 252, risk_free: 0.0}
  bootstrap: {method: stationary_block, mean_block_days: 20, reps: 10000, seed: 42, paired: true}

benchmarks:
  B1: KODEX 200 (069500) 일시 매수 후 보유, 분배금 재투자
  B2: KODEX 200 매월 첫 거래일 정기 매수 (총 자본을 기간 개월 수로 균등 분할) — 참고용, 금액가중수익률 보고
  B3: 같은 시점별 유니버스 동일비중, 분기 리밸런싱 — 종목 선택 효과와 타이밍 효과 분리
  comparator: max_sharpe_of [B1, B3]   # P1·P3·P5의 비교 대상

# 0단계 — 학습 구간 진입 조건 (불충족 시 검증 구간을 쓰지 않고 바로 실패 처리)
train_gate:
  - id: T1
    rule: 학습 구간 Sharpe > comparator Sharpe

# 필터 채택 (학습 구간에서만 판정)
layer_adoption:
  min_sharpe_gain: 0.10              # 학습 구간 전체 Sharpe 개선폭
  min_years_improved: 5              # 학습 8개 연도 중 연간 Sharpe가 개선된 해 수
  disclosure_veto_implement_if:
    min_blocked_entries_train: 10    # 학습 구간에서 실제로 막은 진입 수
    min_forward_return_gap_pct: 1.0  # 막힌 진입의 20일 후 평균수익률이 안 막힌 진입보다 1%p 이상 낮을 것

# 최종 후보 선택: 학습 구간 Sharpe가 가장 높은 것 (S0 계열 vs S0' 튜닝 계열)

# 검증 구간 통과 기준 — 전부 충족해야 채택
test_pass:
  - id: P1
    rule: 검증 Sharpe > comparator Sharpe
  - id: P2
    rule: 검증 MDD가 B1 MDD보다 5%p 넘게 나쁘지 않음
    max_mdd_excess_pct: 5.0
  - id: P3
    rule: 부트스트랩 P(Sharpe_전략 > Sharpe_comparator) >= 0.75
    min_probability: 0.75
  - id: P4
    rule: 검증 Sharpe >= 학습 Sharpe * 0.5
    min_ratio: 0.5
  - id: P5
    rule: 슬리피지 2배(0.2%)에서도 P1 유지
  - id: P6
    rule: 검증 구간 매수 체결 30회 이상
    min_entries: 30
  - id: P7
    rule: 튜닝 계열이 최종 후보일 때만 — Deflated Sharpe >= 0.9, 각 파라미터 ±1단계 이웃의 학습 Sharpe 하락 30% 이내
    min_deflated_sharpe: 0.9
    max_neighbor_drop: 0.30

on_failure: 지수 정기 매수(B2) 전략으로 전환
