# R4 보수형 — 백테스트 실행 전 사전 등록. 결과를 본 뒤 비중·기준을 바꾸지 않는다.
# 실행·비용·과세는 R3 안정형과 같다 (매월 말 판단, 다음 날 시가에 목표 비중). 안정형은 r3_profiles.yaml.

profile:
  kr_1x: 0.25
  us_1x: 0.25
  bond: 0.50       # KODEX 국고채3년 (매매차익 과세)

# 장기 폭락 시험(2000–2019, R3와 같은 구간·합성 주식)의 채권 합성 — 국고채 ETF 이전 시기
# 월 수익률 = 전월 금리/12 - duration * (금리 변화) - 보수/12, 그 달 거래일에 고르게 나눔
# 금리: 한국 3개월 금리(FRED IR3TIB01KRM156N, 2000년부터 있는 가장 긴 시계열)를 3년물 대용으로 쓴다
stress_bond:
  rate: IR3TIB01KRM156N
  duration: 2.7
  annual_drag: 0.0015

# 채택 기준 — 보수형의 목적은 낙폭 축소
criteria:
  - id: K1
    stage: stress
    rule: 장기 폭락 시험 보수형 MDD >= -25% (안정형 R3 결과 -40.8%)
    min_mdd_pct: -25.0
  - id: K2
    stage: train
    rule: 학습 구간 보수형 MDD > 안정형 MDD, 그리고 보수형 CAGR > 0
  - id: K3
    stage: test
    rule: 검증 구간 보수형 MDD >= -25% 이고 안정형 MDD보다 얕음
    min_mdd_pct: -25.0
# K1·K2 통과 시에만 검증 구간 1회 (R4_TEST_RUN.lock). 이때 안정형도 같은 검증 구간 수치를 함께 기록해
# 앱 선택 화면에 쓴다 (안정형은 채택 여부와 무관하게 기본 제공).
