# 시점별(point-in-time) 유니버스. 각 리밸런싱 날짜의 KRX 데이터만으로 정한다.
market: KOSPI
rebalance: quarter_end          # 3·6·9·12월 마지막 거래일 종가 기준, 다음 거래일부터 적용
top_n_by_market_cap: 50
min_history_bars: 250           # 지표 계산에 필요한 상장 후 거래일 수
exclude:
  preferred_shares: true        # 종목코드 끝자리가 0이 아니면 우선주
  name_contains: ["스팩", "리츠"]
# 유니버스에서 빠진 종목: 신규 진입만 막고, 보유분은 청산 조건으로 계속 관리
# 상장폐지(데이터 중단): 마지막 거래 종가 - 슬리피지로 강제 청산
