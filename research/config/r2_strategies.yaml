# 2차 후보 전략 (R2). 백테스트 실행 전 사전 등록 — 결과를 본 뒤 규칙·수치를 바꾸지 않는다.
# 튜닝 없음: 후보마다 아래 1개 설정만 돌린다 (시도 수 = 4).
# 기간·자본·국내 비용은 periods.yaml · strategy.yaml · costs.yaml을 그대로 쓴다.

# --- 자산 -------------------------------------------------------------------
# 국내 ETF 실제 시세(yfinance, 분배금 재투자 수정주가). 미국 지수는 국내 상장 환노출 ETF를 합성한다.
assets:
  kr_1x:   {source: yfinance, ticker: "069500.KS", name: KODEX 200, tax: exempt}
  kr_2x:   {source: yfinance, ticker: "122630.KS", name: KODEX 레버리지, tax: exempt}
  bond:    {source: yfinance, ticker: "114260.KS", name: KODEX 국고채3년, tax: gains}
  us_1x:   {source: synthetic, index: "^SP500TR", leverage: 1, annual_drag: 0.0035, tax: gains}
  us_2x:   {source: synthetic, index: "^SP500TR", leverage: 2, annual_drag: 0.0100, tax: gains}

# 합성 규칙 (국내 상장 환노출 ETF 근사)
#   US 일간 수익률 = leverage * r(S&P500 총수익) - (leverage - 1) * 미국 3개월 국채금리/252 - annual_drag/252
#   원화 가격 = 위 지수 * 원/달러 (FRED DEXKOUS)
#   한국 거래일 d의 가격 = d 이전(d 제외) 마지막 미국 종가·환율 — 국내 장중에는 전날 밤 미국 종가가 반영돼 있다
#   annual_drag: 1배 = 보수 0.1% + 배당 원천징수 0.25%, 2배 = 보수·스왑비용 0.75% + 원천징수 0.25%
synthetic:
  fx: DEXKOUS
  rate: DTB3

# 과세 (매도 시)
#   exempt: 국내 주식형 ETF — 매매차익 비과세
#   gains:  해외지수·채권 ETF — 매매차익에 15.4% (손익통산 없음: 이익 난 매도 건마다 과세)
overseas_gain_tax_rate: 0.154
breakout_slippage_rate: 0.001   # 돌파 매수는 지정가가 아닌 추격 체결로 보고 ETF 기본(0.05%)의 2배

# --- 후보 -------------------------------------------------------------------
candidates:
  A_leverage_trend:
    desc: 레버리지 ETF + 200일선 추세 필터 (국내 50% · 미국 50%)
    sleeves:
      - {weight: 0.5, risk_on: kr_2x, risk_off: bond, signal_index: "코스피 200"}
      - {weight: 0.5, risk_on: us_2x, risk_off: bond, signal_index: "^GSPC"}
    sma_days: 200                 # 신호 지수 종가 > SMA200 이면 risk_on, 아니면 risk_off
    check: daily                  # 매일 종가로 판단, 상태가 바뀐 날 다음 날 시가에 교체
    rebalance: monthly            # 매월 마지막 거래일 종가로 판단해 두 슬리브를 50:50으로 맞춤

  B_dual_momentum:
    desc: 국내 ETF 듀얼 모멘텀 (KODEX 200 · 미국 S&P500 · 국고채3년)
    risky: [kr_1x, us_1x]
    safe: bond
    lookback_days: 252            # 12개월 수익률
    rebalance: monthly            # 매월 마지막 거래일 종가로 판단
    rule: 위험자산 중 수익률이 높은 쪽이 채권 수익률보다 높으면 그 자산 100%, 아니면 채권 100%

  C_short_momentum:
    desc: 코스피 시총 상위 100 단기 모멘텀 (블로그 '연 107%' 주장 재현)
    universe_top_n: 100           # universe.yaml 규칙(우선주·스팩·리츠 제외, 분기 갱신)에서 N만 100
    lookback_days: 160            # 160거래일 수익률 (수정주가)
    hold: 4                       # 상위 4종목 동일비중
    rebalance_every_days: 5       # 5거래일마다 판단, 다음 날 시가 체결
    cash_buffer: 0.005

  D_volatility_breakout:
    desc: 변동성 돌파 (래리 윌리엄스) — KODEX 레버리지 당일 매매
    asset: kr_2x
    k: 0.5                        # 목표가 = 당일 시가 + k * (전일 고가 - 전일 저가)
    rule: 당일 고가가 목표가 이상이면 max(시가, 목표가)에 전액 매수, 다음 날 시가에 전량 매도

# --- 기준 전략 ---------------------------------------------------------------
benchmarks:
  B1: KODEX 200 첫날 매수 후 보유 (P0와 동일)
  B4: KODEX 200 50% + 미국 S&P500(합성 1배) 50%, 매월 첫 거래일 리밸런싱
