# R3 앱 투자 성향 2종 — 백테스트 실행 전 사전 등록. 결과를 본 뒤 비중·기준을 바꾸지 않는다.
# 타이밍 없음: 매월 마지막 거래일 종가로 판단해 다음 날 시가에 목표 비중으로 맞춘다 (R2 B4와 같은 실행).
# 자산 정의·비용·과세는 r2_strategies.yaml을 그대로 쓴다.

profiles:
  stable:       # 안정형 = R2 B4
    kr_1x: 0.50
    us_1x: 0.50
  aggressive:   # 공격형 = 같은 50:50 분산, 각 절반을 1배·2배 반반 → 실질 1.5배
    kr_1x: 0.25
    kr_2x: 0.25
    us_1x: 0.25
    us_2x: 0.25

# 장기 폭락 시험 (닷컴 붕괴·2008 금융위기 포함, 검증 구간 이전까지)
# 국내 ETF가 없던 시기라 국내도 합성한다. 코스피 종합 가격지수(배당 제외 — 수익률은 보수적)를 쓴다.
stress:
  start: "2000-01-03"
  end: "2019-12-30"
  kr_index: "^KS11"
  kr_rate: IR3TIB01KRM156N      # 한국 3개월 금리 (월별, FRED) — 2배 합성의 차입 비용
  kr_1x_annual_drag: 0.0015     # KODEX 200 보수 수준
  kr_2x_annual_drag: 0.0080     # KODEX 레버리지 보수·운용비용 수준

# 채택 기준 — 안정형은 앱 기본값으로 무조건 제공, 공격형은 아래를 모두 통과해야 제공
criteria:
  - id: G1
    stage: stress
    rule: 장기 폭락 시험에서 공격형 MDD >= -50%
    min_mdd_pct: -50.0
  - id: G2
    stage: train
    rule: 학습 구간(2012–2019) 공격형 CAGR > 안정형 CAGR
  - id: G3
    stage: test
    rule: 검증 구간(2020-01 – 2026-09) 공격형 CAGR > 안정형 CAGR 이고 MDD >= -50%
    min_mdd_pct: -50.0
# G1·G2를 통과했을 때만 검증 구간을 1회 사용한다 (R3_TEST_RUN.lock).
# 어느 경우든 안정형·공격형의 MDD, 최장 회복 기간, 최악 연도를 앱 선택 화면용으로 기록한다.
