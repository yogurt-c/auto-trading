[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.25.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (미사용 import·변수)
    "I",   # isort (import 정렬)
    "N",   # pep8-naming (네이밍 컨벤션)
    "B",   # flake8-bugbear (잠재적 버그)
    "C4",  # flake8-comprehensions (리스트·딕셔너리 컴프리헨션 최적화)
    "UP",  # pyupgrade (구버전 Python 문법 현대화)
    "SIM", # flake8-simplify (불필요하게 복잡한 코드 단순화)
    "PT",  # flake8-pytest-style (pytest 관용 패턴)
    "T20", # flake8-print (print() 사용 감지)
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # FastAPI Depends()를 기본값으로 사용하는 표준 패턴
    "B904",  # except 안에서 HTTPException raise — FastAPI 표준 패턴
    "E402",  # conftest.py에서 os.environ 설정 후 import하는 의도적 패턴
    "TC001", # Move application import into a type-checking block
    "TC002", # Move third-party import into a type-checking block
    "TC003", # Move standard library import into a type-checking block
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert 사용 허용
    "PLR2004", # 매직 넘버 허용
]
"alembic/**" = ["ALL"] # 자동 생성 파일 전체 예외
